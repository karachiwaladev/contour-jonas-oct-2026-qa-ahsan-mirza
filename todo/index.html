<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form id="new-task" class="new-task" autocomplete="off">
      <label for="task-title" class="visually-hidden">New task</label>
      <input id="task-title" name="title" type="text" placeholder="What needs doing?" maxlength="200" required>
      <div class="new-task-extras">
        <label class="field">
          <span>Due</span>
          <input id="task-due" name="due" type="date">
        </label>
        <label class="field">
          <span>Repeat</span>
          <select id="task-repeat" name="repeat">
            <option value="">None</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </label>
        <label class="field grow">
          <span>Tags</span>
          <input id="task-tags" name="tags" type="text" placeholder="work, urgent" maxlength="200">
        </label>
        <button type="submit">Add</button>
      </div>
    </form>

    <div class="filters" aria-label="Filters">
      <div class="status-filter" role="group" aria-label="Show">
        <button type="button" data-status="all" aria-pressed="true">All</button>
        <button type="button" data-status="active" aria-pressed="false">Active</button>
        <button type="button" data-status="completed" aria-pressed="false">Completed</button>
      </div>
      <label class="field">
        <span class="visually-hidden">Filter by tag</span>
        <select id="tag-filter">
          <option value="">All tags</option>
        </select>
      </label>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <ul id="task-list" class="task-list" aria-label="Tasks"></ul>

    <p id="empty" class="empty" hidden></p>
  </main>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
