<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Todo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form id="new-task" class="new-task" autocomplete="off">
      <label for="task-title" class="visually-hidden">New task</label>
      <input id="task-title" name="title" type="text" placeholder="What needs doing?" maxlength="200" required>
      <div class="new-task-extras">
        <label class="field">
          <span>Due</span>
          <input id="task-due" name="due" type="date" min="1900-01-01" max="9999-12-31">
        </label>
        <label class="field">
          <span>Priority</span>
          <select id="task-priority" name="priority">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </label>
        <label class="field">
          <span>Repeat</span>
          <select id="task-repeat" name="repeat">
            <option value="">None</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </label>
        <label class="field grow">
          <span>Tags</span>
          <input id="task-tags" name="tags" type="text" placeholder="work, urgent" maxlength="200">
        </label>
        <button type="submit">Add</button>
      </div>
    </form>

    <div class="search" role="search">
      <label for="task-search" class="visually-hidden">Search tasks</label>
      <input id="task-search" type="search" placeholder="Search tasks by title or tag…" maxlength="100" autocomplete="off" spellcheck="false">
    </div>

    <div class="filters" aria-label="Filters">
      <div class="status-filter" role="group" aria-label="Show">
        <button type="button" data-status="all" aria-pressed="true">All</button>
        <button type="button" data-status="active" aria-pressed="false">Active</button>
        <button type="button" data-status="completed" aria-pressed="false">Completed</button>
      </div>
      <div class="filter-selects">
        <label class="field">
          <span class="visually-hidden">Filter by priority</span>
          <select id="priority-filter" autocomplete="off">
            <option value="">All priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </label>
        <label class="field">
          <span class="visually-hidden">Filter by due date</span>
          <select id="due-filter" autocomplete="off">
            <option value="">All dates</option>
            <option value="overdue">Overdue</option>
            <option value="today">Due today</option>
            <option value="week">Next 7 days</option>
            <option value="none">No date</option>
          </select>
        </label>
        <label class="field">
          <span class="visually-hidden">Filter by tag</span>
          <select id="tag-filter" autocomplete="off">
            <option value="">All tags</option>
          </select>
        </label>
      </div>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <ul id="task-list" class="task-list" aria-label="Tasks"></ul>

    <p id="empty" class="empty" hidden></p>
  </main>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
